<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Refaccionaria — Prueba de conexiones</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#0f1117; --surface:#181c27; --border:#252a38;
    --accent:#4f8ef7; --accent2:#38d9a9; --danger:#ff6b6b;
    --text:#e8eaf0; --muted:#6b7280;
    --mono:'DM Mono',monospace; --sans:'DM Sans',sans-serif;
  }
  body {
    background:var(--bg); color:var(--text); font-family:var(--sans);
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; padding:24px 16px; gap:20px;
  }
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(ellipse 600px 400px at 20% 20%,rgba(79,142,247,0.06) 0%,transparent 70%),
      radial-gradient(ellipse 400px 600px at 80% 80%,rgba(56,217,169,0.04) 0%,transparent 70%);
  }
  .container { position:relative; z-index:1; width:100%; max-width:480px; }
  .header { text-align:center; padding:8px 0 20px; }
  .header .logo { display:inline-flex; align-items:center; gap:10px; margin-bottom:8px; }
  .logo-icon { width:36px; height:36px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; }
  .logo-text { font-family:var(--mono); font-size:15px; font-weight:500; color:var(--text); letter-spacing:-0.3px; }
  .header p { font-size:12px; color:var(--muted); font-family:var(--mono); }
  .status-bar { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .status-left { display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
  .status-dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex-shrink:0; transition:background 0.3s; }
  .status-dot.ok { background:var(--accent2); box-shadow:0 0 8px rgba(56,217,169,0.5); animation:pulse-green 2s infinite; }
  .status-dot.error { background:var(--danger); box-shadow:0 0 8px rgba(255,107,107,0.5); }
  .status-dot.loading { background:var(--accent); animation:pulse-blue 1s infinite; }
  @keyframes pulse-green { 0%,100%{opacity:1} 50%{opacity:0.5} }
  @keyframes pulse-blue { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3)} }
  .status-info { min-width:0; }
  .status-label { font-size:11px; color:var(--muted); font-family:var(--mono); margin-bottom:2px; }
  .status-url { font-size:12px; color:var(--text); font-family:var(--mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .status-msg { font-size:11px; font-family:var(--mono); flex-shrink:0; }
  .status-msg.ok { color:var(--accent2); } .status-msg.error { color:var(--danger); }
  .btn-check { background:rgba(79,142,247,0.1); border:1px solid rgba(79,142,247,0.2); color:var(--accent); padding:6px 12px; border-radius:8px; font-size:11px; font-family:var(--mono); cursor:pointer; flex-shrink:0; transition:all 0.2s; white-space:nowrap; }
  .btn-check:hover { background:rgba(79,142,247,0.2); }
  .url-row { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 14px; display:flex; align-items:center; gap:8px; }
  .url-row label { font-size:10px; font-family:var(--mono); color:var(--muted); flex-shrink:0; text-transform:uppercase; letter-spacing:0.5px; }
  .url-row input { flex:1; background:transparent; border:none; outline:none; color:var(--accent); font-family:var(--mono); font-size:12px; min-width:0; }
  .url-row input::placeholder { color:var(--muted); }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden; }
  .tabs { display:flex; border-bottom:1px solid var(--border); }
  .tab { flex:1; padding:14px; text-align:center; font-size:12px; font-family:var(--mono); color:var(--muted); cursor:pointer; transition:all 0.2s; border:none; background:transparent; position:relative; }
  .tab.active { color:var(--accent); }
  .tab.active::after { content:''; position:absolute; bottom:-1px; left:20%; right:20%; height:2px; background:var(--accent); border-radius:2px 2px 0 0; }
  .tab:hover:not(.active) { color:var(--text); background:rgba(255,255,255,0.02); }
  .form-body { padding:24px; display:flex; flex-direction:column; gap:16px; }
  .field { display:flex; flex-direction:column; gap:6px; }
  .field label { font-size:11px; font-family:var(--mono); color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; }
  .field input, .field select { background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:10px; padding:11px 14px; color:var(--text); font-family:var(--sans); font-size:14px; outline:none; transition:border-color 0.2s,background 0.2s; width:100%; }
  .field input:focus, .field select:focus { border-color:var(--accent); background:rgba(79,142,247,0.04); }
  .field select option { background:var(--surface); }
  .row-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .btn-main { width:100%; padding:13px; border-radius:10px; border:none; background:var(--accent); color:white; font-family:var(--mono); font-size:13px; font-weight:500; cursor:pointer; transition:all 0.2s; letter-spacing:0.3px; }
  .btn-main:hover { background:#6ba3f9; transform:translateY(-1px); }
  .btn-main:active { transform:translateY(0); }
  .btn-main:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
  .alert { padding:12px 14px; border-radius:10px; font-size:13px; font-family:var(--mono); line-height:1.5; display:none; }
  .alert.show { display:block; }
  .alert.success { background:rgba(56,217,169,0.08); border:1px solid rgba(56,217,169,0.2); color:var(--accent2); }
  .alert.error { background:rgba(255,107,107,0.08); border:1px solid rgba(255,107,107,0.2); color:var(--danger); }
  .token-box { background:rgba(56,217,169,0.06); border:1px solid rgba(56,217,169,0.15); border-radius:10px; padding:12px; display:none; }
  .token-box.show { display:block; }
  .token-label { font-size:10px; font-family:var(--mono); color:var(--accent2); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px; }
  .token-value { font-family:var(--mono); font-size:10px; color:rgba(56,217,169,0.7); word-break:break-all; line-height:1.6; cursor:pointer; transition:color 0.2s; }
  .token-value:hover { color:var(--accent2); }
  .token-user { margin-top:8px; padding-top:8px; border-top:1px solid rgba(56,217,169,0.1); font-size:11px; color:var(--accent2); font-family:var(--mono); }
  .log-section { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .log-header { padding:10px 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .log-title { font-size:11px; font-family:var(--mono); color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; }
  .btn-clear { font-size:10px; font-family:var(--mono); color:var(--muted); background:none; border:none; cursor:pointer; padding:2px 6px; border-radius:4px; transition:color 0.2s; }
  .btn-clear:hover { color:var(--danger); }
  .log-body { padding:12px 14px; max-height:180px; overflow-y:auto; display:flex; flex-direction:column; gap:4px; scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
  .log-body:empty::after { content:'Sin actividad aún...'; color:var(--muted); font-family:var(--mono); font-size:11px; }
  .log-line { font-family:var(--mono); font-size:11px; line-height:1.5; display:flex; gap:8px; }
  .log-time { color:var(--muted); flex-shrink:0; }
  .log-ok { color:var(--accent2); } .log-err { color:var(--danger); }
  .log-info { color:var(--accent); } .log-warn { color:#fbbf24; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .spinner { display:inline-block; width:12px; height:12px; border:2px solid rgba(255,255,255,0.2); border-top-color:white; border-radius:50%; animation:spin 0.7s linear infinite; vertical-align:middle; margin-right:6px; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .container > * { animation:fadeUp 0.4s ease both; }
  .container > *:nth-child(1){animation-delay:0s}
  .container > *:nth-child(2){animation-delay:0.05s}
  .container > *:nth-child(3){animation-delay:0.1s}
  .container > *:nth-child(4){animation-delay:0.15s}
  .container > *:nth-child(5){animation-delay:0.2s}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">
      <div class="logo-icon">🔧</div>
      <div class="logo-text">refaccionaria · sistema</div>
    </div>
    <p>panel de prueba de conexiones</p>
  </div>

  <div class="url-row">
    <label>API</label>
    <input type="text" id="apiUrl" placeholder="https://tu-backend.railway.app/api" value="http://localhost:3000/api"/>
  </div>

  <div class="status-bar">
    <div class="status-left">
      <div class="status-dot" id="statusDot"></div>
      <div class="status-info">
        <div class="status-label">estado del servidor</div>
        <div class="status-url" id="statusUrl">Sin verificar</div>
      </div>
    </div>
    <span class="status-msg" id="statusMsg"></span>
    <button class="btn-check" onclick="checkServer()">Verificar →</button>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login',this)">login</button>
      <button class="tab" onclick="switchTab('registro',this)">registro</button>
    </div>
    <div id="tab-login" class="form-body">
      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="admin@taller.com"/>
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="loginPass" placeholder="••••••••"/>
      </div>
      <div class="alert" id="loginAlert"></div>
      <div class="token-box" id="loginToken">
        <div class="token-label">✓ Token JWT — haz clic para copiar</div>
        <div class="token-value" id="tokenVal" onclick="copiarToken()"></div>
        <div class="token-user" id="tokenUser"></div>
      </div>
      <button class="btn-main" onclick="hacerLogin()">Iniciar sesión</button>
    </div>
    <div id="tab-registro" class="form-body" style="display:none">
      <div class="row-2">
        <div class="field">
          <label>Nombre</label>
          <input type="text" id="regNombre" placeholder="Juan Pérez"/>
        </div>
        <div class="field">
          <label>Rol</label>
          <select id="regRol">
            <option value="ADMIN">ADMIN</option>
            <option value="RECEPCIONISTA">RECEPCIONISTA</option>
            <option value="MECANICO">MECANICO</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="usuario@taller.com"/>
      </div>
      <div class="row-2">
        <div class="field">
          <label>Contraseña</label>
          <input type="password" id="regPass" placeholder="mínimo 6 caracteres"/>
        </div>
        <div class="field">
          <label>Confirmar</label>
          <input type="password" id="regPass2" placeholder="repetir"/>
        </div>
      </div>
      <div class="alert" id="regAlert"></div>
      <button class="btn-main" onclick="hacerRegistro()">Crear usuario</button>
    </div>
  </div>

  <div class="log-section">
    <div class="log-header">
      <span class="log-title">log de actividad</span>
      <button class="btn-clear" onclick="limpiarLog()">limpiar</button>
    </div>
    <div class="log-body" id="logBody"></div>
  </div>
</div>

<script>
  const getUrl=()=>document.getElementById('apiUrl').value.trim().replace(/\/$/,'');
  const log=(tipo,msg)=>{
    const body=document.getElementById('logBody');
    const now=new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    const line=document.createElement('div');
    line.className='log-line';
    line.innerHTML=`<span class="log-time">${now}</span><span class="log-${tipo}">${msg}</span>`;
    body.appendChild(line);
    body.scrollTop=body.scrollHeight;
  };
  const limpiarLog=()=>{document.getElementById('logBody').innerHTML='';};
  const switchTab=(tab,btn)=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-login').style.display=tab==='login'?'flex':'none';
    document.getElementById('tab-registro').style.display=tab==='registro'?'flex':'none';
    document.getElementById('loginAlert').className='alert';
    document.getElementById('regAlert').className='alert';
  };
  const showAlert=(id,tipo,msg)=>{
    const el=document.getElementById(id);
    el.className=`alert ${tipo} show`;
    el.textContent=msg;
  };
  const checkServer=async()=>{
    const dot=document.getElementById('statusDot');
    const msg=document.getElementById('statusMsg');
    const url=document.getElementById('statusUrl');
    dot.className='status-dot loading';
    msg.className='status-msg';
    msg.textContent='verificando...';
    url.textContent=getUrl();
    log('info',`GET ${getUrl()}/health`);
    try{
      const res=await fetch(`${getUrl()}/health`,{signal:AbortSignal.timeout(5000)});
      const data=await res.json();
      if(res.ok){
        dot.className='status-dot ok';
        msg.className='status-msg ok';
        msg.textContent='● conectado';
        log('ok',`servidor OK — env:${data.env??'unknown'} — ${res.status}`);
      }else throw new Error(`HTTP ${res.status}`);
    }catch(err){
      dot.className='status-dot error';
      msg.className='status-msg error';
      msg.textContent='✕ sin conexión';
      log('err',`error: ${err.message}`);
    }
  };
  const hacerLogin=async()=>{
    const email=document.getElementById('loginEmail').value.trim();
    const pass=document.getElementById('loginPass').value;
    const btn=document.querySelector('#tab-login .btn-main');
    if(!email||!pass){showAlert('loginAlert','error','Completa todos los campos');return;}
    btn.disabled=true;
    btn.innerHTML='<span class="spinner"></span>verificando...';
    document.getElementById('loginAlert').className='alert';
    document.getElementById('loginToken').className='token-box';
    log('info',`POST /auth/login — ${email}`);
    try{
      const res=await fetch(`${getUrl()}/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
      const data=await res.json();
      if(res.ok){
        localStorage.setItem('token',data.token);
        localStorage.setItem('usuario',JSON.stringify(data.usuario));
        showAlert('loginAlert','success',`✓ Login exitoso — bienvenido ${data.usuario.nombre}`);
        const tokenBox=document.getElementById('loginToken');
        tokenBox.className='token-box show';
        document.getElementById('tokenVal').textContent=data.token;
        document.getElementById('tokenUser').textContent=`👤 ${data.usuario.nombre}  ·  🔑 ${data.usuario.rol}  ·  📧 ${data.usuario.email}`;
        log('ok',`login OK — rol:${data.usuario.rol}`);
        log('ok',`token: ${data.token.substring(0,50)}...`);
      }else{
        showAlert('loginAlert','error',data.mensaje||'Credenciales inválidas');
        log('err',`login fallido — ${res.status}: ${data.mensaje}`);
      }
    }catch(err){
      showAlert('loginAlert','error',`Error de red: ${err.message}`);
      log('err',`error de red: ${err.message}`);
    }finally{
      btn.disabled=false;
      btn.innerHTML='Iniciar sesión';
    }
  };
  const hacerRegistro=async()=>{
    const nombre=document.getElementById('regNombre').value.trim();
    const email=document.getElementById('regEmail').value.trim();
    const pass=document.getElementById('regPass').value;
    const pass2=document.getElementById('regPass2').value;
    const rol=document.getElementById('regRol').value;
    const btn=document.querySelector('#tab-registro .btn-main');
    if(!nombre||!email||!pass){showAlert('regAlert','error','Completa todos los campos');return;}
    if(pass!==pass2){showAlert('regAlert','error','Las contraseñas no coinciden');return;}
    if(pass.length<6){showAlert('regAlert','error','Mínimo 6 caracteres');return;}
    const token=localStorage.getItem('token');
    if(!token){showAlert('regAlert','error','Primero inicia sesión como ADMIN');log('warn','registro bloqueado — se requiere token de admin');return;}
    btn.disabled=true;
    btn.innerHTML='<span class="spinner"></span>creando...';
    document.getElementById('regAlert').className='alert';
    log('info',`POST /auth/registro — ${email} — ${rol}`);
    try{
      const res=await fetch(`${getUrl()}/auth/registro`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify({nombre,email,password:pass,rol})});
      const data=await res.json();
      if(res.ok){
        showAlert('regAlert','success',`✓ Usuario creado — ${data.usuario.nombre} (${data.usuario.rol})`);
        log('ok',`registro OK — ${data.usuario.nombre} — ${data.usuario.rol}`);
        document.getElementById('regNombre').value='';
        document.getElementById('regEmail').value='';
        document.getElementById('regPass').value='';
        document.getElementById('regPass2').value='';
      }else{
        showAlert('regAlert','error',data.mensaje||'Error al crear usuario');
        log('err',`registro fallido — ${res.status}: ${data.mensaje}`);
      }
    }catch(err){
      showAlert('regAlert','error',`Error de red: ${err.message}`);
      log('err',`error: ${err.message}`);
    }finally{
      btn.disabled=false;
      btn.innerHTML='Crear usuario';
    }
  };
  const copiarToken=()=>{
    const token=document.getElementById('tokenVal').textContent;
    navigator.clipboard.writeText(token).then(()=>log('ok','token copiado al portapapeles'));
  };
  document.addEventListener('keydown',e=>{
    if(e.key!=='Enter')return;
    const loginTab=document.getElementById('tab-login');
    if(loginTab.style.display!=='none'){hacerLogin();}else{hacerRegistro();}
  });
  window.addEventListener('load',()=>{
    const saved=localStorage.getItem('token');
    if(saved){log('info','token previo en localStorage');log('ok',`${saved.substring(0,50)}...`);}
    setTimeout(checkServer,500);
  });
</script>
</body>
</html>
